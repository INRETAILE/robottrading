<!-- FIREBASE - EXTENSION SAFE - NO LISTENER -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyABi2dSXG4ExjAuUho5bDNpYE3whvzDnY8",
  authDomain: "robot-trading-d49e1.firebaseapp.com",
  projectId: "robot-trading-d49e1",
  storageBucket: "robot-trading-d49e1.firebasestorage.app",
  messagingSenderId: "202098687322",
  appId: "1:202098687322:web:e55aa52339f715608e8763"
};
let db=null;
try{
  firebase.initializeApp(firebaseConfig);
  db=firebase.firestore();
  console.log("✅ Firebase Connected - SAFE MODE");
}catch(e){console.error(e);}

window.syncUserToFirebase = function(u){
  if(!db || !u || !u.username) return Promise.resolve();
  return db.collection("robot_users").doc(u.username).set({
    username: u.username,
    password: u.password,
    plan: u.plan,
    expiry: u.expiry,
    telegramId: u.telegramId || "",
    whatsappNumber: u.whatsappNumber || "",
    lastUpdated: new Date().toISOString()
  },{merge:true}).then(()=>console.log("☁️ Saved:",u.username));
};

window.syncAllNow = function(){
  try{
    const users = JSON.parse(localStorage.getItem("paid_users")||"[]");
    console.log("Uploading", users.length, "users...");
    return Promise.all(users.map(u=> window.syncUserToFirebase(u))).then(()=>{
      console.log("✅ ALL SYNCED TO FIREBASE");
      alert("✅ "+users.length+" users synced to Firebase!");
    });
  }catch(e){console.error(e);}
};

// Auto sync when paid_users changes
const _setItem = localStorage.setItem.bind(localStorage);
localStorage.setItem = function(k,v){
  _setItem(k,v);
  if(k==="paid_users" && db){
    try{
      const arr = JSON.parse(v);
      if(Array.isArray(arr) && arr.length>0){
        const last = arr[arr.length-1];
        if(last && last.username) window.syncUserToFirebase(last);
      }
    }catch(e){}
  }
};

// On load, merge cloud into local ONCE (no realtime)
window.addEventListener('load', ()=>{
  if(!db) return;
  setTimeout(()=>{
    db.collection("robot_users").get().then(snap=>{
      const cloud=[];
      snap.forEach(d=> cloud.push(d.data()));
      if(cloud.length>0){
        const local = JSON.parse(localStorage.getItem("paid_users")||"[]");
        const map = new Map();
        [...local, ...cloud].forEach(u=>{ if(u.username) map.set(u.username, {...(map.get(u.username)||{}), ...u}) });
        const merged = Array.from(map.values());
        if(merged.length !== local.length){
          localStorage.setItem("paid_users", JSON.stringify(merged));
          console.log("✅ Merged", merged.length, "users - reloading...");
          setTimeout(()=> location.reload(), 1000);
        } else {
          console.log("✅ Already in sync:", merged.length, "users");
        }
      }
    }).catch(e=> console.log("Firebase load skipped:", e.message));
  }, 2000);
});
</script>
